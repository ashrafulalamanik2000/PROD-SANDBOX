# DFX process (csv/shp/lasindex/pano) — fully native, no Docker: pano runs
# pano_generator.py with this same interpreter (cv2 + PIL). geopandas comes as
# pip wheels (pyogrio bundles GDAL). Headless opencv: the entry never opens
# windows. lazrs added so laspy can read .laz.
kind: uv
python: '3.12'
deps:
- geopandas
- laspy
- lazrs
- numpy
- pandas
- pyproj
- shapely
- opencv-python-headless
- pillow
