# The environment las-info runs in. Locked via `sdtools env lock pointcloud`;
# requirements.lock is committed, so every machine builds the identical tree.
kind: uv
python: "3.12"
deps:
  - laspy[lazrs]>=2.5
  - numpy>=1.26
env:
  # example: settings every tool in this env should see
  PYTHONHASHSEED: "0"
