# AECON tree stem + canopy extraction — pure CPU, deterministic, no Docker
# (the skill's own README: "no pixi, no Docker, no chain-orchestrator").
# geopandas via pip wheels (pyogrio bundles GDAL + PROJ data). lazrs so laspy
# reads the classified *_0p1m.laz input.
kind: uv
python: '3.12'
deps:
- geopandas
- laspy
- lazrs
- numpy
- scipy
- shapely
