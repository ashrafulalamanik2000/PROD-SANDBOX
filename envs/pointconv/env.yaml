# Host-side deps ONLY (per src/SETUP.md §4 plus pyproj used by pointconv_classify
# and lazrs so laspy can read .laz): the presample/preflight steps run on the host,
# the TF1/GPU inference runs inside the mmworkflow Docker image which carries its
# own stack (tf1/requirements.txt is for INSIDE the container — do not add it here).
# `sdtools env lock pointconv` writes the lockfile; commit it.
kind: uv
python: '3.12'
deps:
- laspy
- lazrs
- numpy
- scipy
- scikit-learn
- pyproj
- pyyaml
- tqdm
