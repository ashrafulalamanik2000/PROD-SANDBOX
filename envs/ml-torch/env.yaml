# ML environment via pixi (conda-forge): use this kind when you need things
# pip can't give you deterministically — CUDA toolkits, PDAL, GDAL binaries.
# `pixi lock` writes pixi.lock; commit both files. Machines need pixi installed
# once; after that everything comes from the lockfile.
#
# NOTE: written against pixi's current manifest format but NOT exercised in
# the build sandbox (pixi's installer was unreachable there). Validate with
# `sdtools env resolve ml-torch` on a real machine before relying on it.
kind: pixi
env:
  CUDA_MODULE_LOADING: LAZY
