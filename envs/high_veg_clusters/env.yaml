# High-veg TREE CLUSTER outlines (DFX off-pipeline; in-house alternative to
# outsourced tree-cluster extraction). Pure python: children run via
# sys.executable, so this env serves the whole chain. lazrs for .laz IO.
kind: uv
python: '3.12'
deps:
- geopandas
- laspy
- lazrs
- numpy
- scipy
- shapely
